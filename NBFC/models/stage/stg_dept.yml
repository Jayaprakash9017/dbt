
version: 2

models:
  - name: stg_dept
    description: "Department details with city and country information"

    columns:
      - name: department_id
        description: "Unique department identifier"
        data_tests:
          - not_null
          - unique

      - name: department_name
        description: "Department name"
        data_tests:
          - not_null

      - name: city
        description: "City name"
        data_tests:
          - not_null

      - name: country_name
        description: "Country name"
        data_tests:
          - not_null
